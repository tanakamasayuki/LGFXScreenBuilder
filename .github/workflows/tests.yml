name: tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Guard against committed generated headers drifting from the codegen.
      # Runs on the pristine checkout, before any test regenerates a header.
      - name: Check generated headers are up to date
        run: node tools/gen-fixtures.mjs --check

      # SPEC §9.2: project files must stay in canonical serializer form; a diff
      # means the project-file format moved (independent of codegen changes).
      - name: Check project files are canonical
        run: node tools/check-formats.mjs --check

      # SPEC §10.2: the embedded AI-layout comment block is a contract the
      # gallery parses from the *.h alone — ensure it stays opt-in, "*/"-free,
      # parseable, and faithful to buildAiLayout.
      - name: Check embedded AI-layout block parses
        run: node tools/check-ai-layout-embed.mjs

      # SPEC §14: every language table must match the en key set (no missing key
      # silently falling back to English, no stray typo'd key).
      - name: Check i18n key parity
        run: node tools/check-i18n.mjs

      - name: Install SDL2 (headless LovyanGFX / M5GFX backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Show arduino-cli version
        run: arduino-cli version

      - name: Initialize arduino-cli
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        working-directory: tests
        run: uv sync

      - name: Run pytest
        working-directory: tests
        run: uv run pytest -v --html=report.html --self-contained-html

      - name: Upload graphics output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-output
          path: tests/**/output/**
          if-no-files-found: ignore

      - name: Upload pytest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: tests/report.html
          if-no-files-found: ignore

  # Compile every bundled example for a real device (esp32) and the host backend
  # (display_core). The esp32 build is what catches platform-macro collisions the
  # host cannot — e.g. xtensa specreg.h defining `MR`, which broke the Datum enum.
  # Each example's sketch.yaml profile is self-contained (it pins and auto-installs
  # its platform + libraries), so no global board-manager config is needed.
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [BasicLovyanGFX, BasicM5Unified, ExportedSample, OverlayM5Unified]
        profile: [esp32, display_core]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Needed to link the host (lang-ship:host SDL) backend for the display_core
      # profile; harmless for the esp32 profile.
      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize arduino-cli
        run: arduino-cli config init --overwrite

      - name: Compile ${{ matrix.example }} (${{ matrix.profile }})
        run: arduino-cli compile --profile ${{ matrix.profile }} examples/${{ matrix.example }}
