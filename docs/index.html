<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LGFXScreenBuilder</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <h1>LGFXScreenBuilder</h1>
    <nav class="modes" id="modes">
      <button class="mode active" data-mode="design">Design</button>
      <button class="mode" data-mode="profiles" disabled>Profiles</button>
      <button class="mode" data-mode="assets" disabled>Assets</button>
      <button class="mode" data-mode="export" disabled>Export</button>
    </nav>
    <span class="grow"></span>
    <span class="note">MVP foundation — Design</span>
  </header>

  <div class="cols">
    <aside class="left">
      <div class="section">
        <h2>Scenes</h2>
        <div class="list" id="scene-list"></div>
      </div>
      <div class="section">
        <h2 id="parts-title">Parts</h2>
        <div class="list" id="part-list"></div>
      </div>
      <div class="section">
        <h2>このプロファイル</h2>
        <div id="prof-meta"></div>
      </div>
    </aside>

    <main class="center">
      <div class="tabs" id="profile-tabs"></div>
      <div class="zbar">
        <span class="sub">中ボタン=パン／ホイール=ズーム</span>
        <span class="grow"></span>
        <button class="mini" id="zoom-out">−</button>
        <span class="sub" id="zoom-label">100%</span>
        <button class="mini" id="zoom-in">＋</button>
        <button class="mini" id="zoom-reset">100%</button>
      </div>
      <div class="stage" id="stage">
        <div class="device"><div class="screen" id="canvas-screen"></div></div>
      </div>
      <div class="statusbar"><span id="st-sel">未選択</span><span id="st-prof"></span></div>
    </main>

    <aside class="right">
      <div class="section">
        <h2 id="insp-title">プロパティ</h2>
        <div id="props"></div>
      </div>
    </aside>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
