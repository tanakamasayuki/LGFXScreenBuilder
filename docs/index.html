<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LGFXScreenBuilder</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
    }

    main {
      width: min(720px, calc(100% - 32px));
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 20px;
      max-width: 60ch;
    }

    a {
      color: LinkText;
    }
  </style>
</head>
<body>
  <main>
    <h1>LGFXScreenBuilder</h1>
    <p>LovyanGFX / M5GFX 向け Arduino UI オーサリングツールの準備ページです。</p>
    <p>ここに GitHub Pages で動作するオーサリングツールを配置します。</p>
    <p><a href="https://github.com/tanakamasayuki/LGFXScreenBuilder">GitHub repository</a></p>
  </main>
</body>
</html>
