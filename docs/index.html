<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LGFXScreenBuilder</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <h1>LGFXScreenBuilder</h1>
    <nav class="modes" id="modes">
      <button class="mode active" data-mode="design" data-i18n="mode.design">Design</button>
      <button class="mode" data-mode="profiles" data-i18n="mode.profiles">Profiles</button>
      <button class="mode" data-mode="assets" data-i18n="mode.assets" disabled>Assets</button>
      <button class="mode" data-mode="export" data-i18n="mode.export" disabled>Export</button>
    </nav>
    <span class="toolsep"></span>
    <nav class="tools">
      <button class="mini" id="btn-new" data-i18n="btn.new">New</button>
      <button class="mini" id="btn-open" data-i18n="btn.open">Open</button>
      <button class="mini" id="btn-save" data-i18n="btn.save">Save</button>
      <button class="mini" id="btn-export-h" data-i18n="btn.exportH">Export .h</button>
    </nav>
    <span class="grow"></span>
    <span class="note" data-i18n="app.note">MVP foundation — Design</span>
    <label class="langsel">🌐
      <select id="lang">
        <option value="en">EN</option>
        <option value="ja">日本語</option>
      </select>
    </label>
  </header>

  <div id="view-design" class="view">
  <div class="cols">
    <aside class="left">
      <div class="section">
        <div class="sechead">
          <h2 data-i18n="pane.scenes">Scenes</h2>
          <div class="secacts">
            <button class="icon" id="scene-add" data-i18n-title="act.addScene">＋</button>
            <button class="icon" id="scene-del" data-i18n-title="act.delScene">🗑</button>
          </div>
        </div>
        <div class="list" id="scene-list"></div>
      </div>
      <div class="section">
        <h2 id="parts-title" data-i18n="pane.parts">Parts</h2>
        <div class="layerbar">
          <select class="icon" id="part-type">
            <option value="Rect">Rect</option>
            <option value="Text">Text</option>
            <option value="Image">Image</option>
          </select>
          <button class="icon" id="part-add" data-i18n-title="act.addPart">＋</button>
          <button class="icon" id="part-del" data-i18n-title="act.delPart">🗑</button>
          <span class="toolsep"></span>
          <button class="icon" id="part-front" data-i18n-title="act.front">↑</button>
          <button class="icon" id="part-back" data-i18n-title="act.back">↓</button>
          <button class="icon" id="part-group" data-i18n-title="act.group">⊞</button>
          <button class="icon" id="part-ungroup" data-i18n-title="act.ungroup">⊟</button>
        </div>
        <div class="list" id="part-list"></div>
      </div>
      <div class="section">
        <h2 data-i18n="pane.profile">This profile</h2>
        <div id="prof-meta"></div>
      </div>
    </aside>

    <main class="center">
      <div class="tabs" id="profile-tabs"></div>
      <div class="zbar">
        <span class="sub" data-i18n="zbar.hint">Middle button = pan / wheel = zoom</span>
        <span class="grow"></span>
        <button class="mini" id="zoom-out">−</button>
        <span class="sub" id="zoom-label">100%</span>
        <button class="mini" id="zoom-in">＋</button>
        <button class="mini" id="zoom-reset">100%</button>
      </div>
      <div class="stage" id="stage">
        <div class="device"><div class="screen" id="canvas-screen"></div></div>
      </div>
      <div class="statusbar"><span id="st-sel"></span><span id="st-prof"></span></div>
    </main>

    <aside class="right">
      <div class="section">
        <h2 id="insp-title" data-i18n="inspector.title">Properties</h2>
        <div id="props"></div>
      </div>
    </aside>
  </div>
  </div><!-- /view-design -->

  <div id="view-profiles" class="view" hidden>
    <div class="libbar">
      <label class="libbar-label" for="lib-target" data-i18n="libbar.label">Target library</label>
      <select id="lib-target">
        <option value="M5Unified">M5Unified</option>
        <option value="M5GFX">M5GFX</option>
        <option value="LovyanGFX">LovyanGFX</option>
      </select>
      <span class="libbar-note" id="lib-note"></span>
    </div>
    <div class="banner" id="prof-banner"></div>
    <div class="cols">
      <aside class="left">
        <div class="section">
          <div class="sechead">
            <h2 data-i18n="pane.profiles">Profiles</h2>
            <span class="menu-wrap">
              <button class="icon" id="profile-add" data-i18n="profiles.add">+ Add ▾</button>
              <div class="menu" id="profile-add-menu"></div>
            </span>
          </div>
          <div class="list" id="profile-list"></div>
        </div>
      </aside>
      <main class="center">
        <div class="section" style="background:var(--panel)">
          <div class="sechead"><h2 data-i18n="section.orientSize">Orientation &amp; size</h2><span class="sub" id="profile-title"></span></div>
        </div>
        <div class="stage">
          <div class="preview">
            <div class="device" id="prof-device"><div class="screen prof-screen" id="prof-screen"></div></div>
            <div class="sizelabel" id="prof-size"></div>
            <div><span class="badge" id="prof-rot"></span> <span class="sub" id="prof-orient"></span></div>
            <div style="margin-top:6px;width:100%">
              <h2 style="margin-bottom:6px" data-i18n="section.assigned">Assigned boards</h2>
              <div class="chips" id="prof-chips"></div>
            </div>
          </div>
        </div>
        <div class="section" style="background:var(--panel)">
          <div class="sechead">
            <h2 data-i18n="section.assignBoards">Assign boards (click to toggle)</h2>
            <label class="sub" style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="hide-mismatch" checked style="width:auto;min-height:auto"> <span data-i18n="profiles.hideMismatch">Hide size-mismatched boards</span></label>
          </div>
          <div class="catalog" id="board-catalog"></div>
        </div>
      </main>
      <aside class="right">
        <div class="section">
          <h2 data-i18n="inspector.title">Properties</h2>
          <div id="prof-props"></div>
        </div>
      </aside>
    </div>
  </div><!-- /view-profiles -->

  <script type="module" src="./src/main.js"></script>
</body>
</html>
