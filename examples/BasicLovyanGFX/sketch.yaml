# en: LovyanGFX build profiles. The Native (SDL) profiles render the screen on a
#     PC with no hardware. They are limited to boards LovyanGFX can drive itself;
#     M5GFX/M5Unified-only boards (Dial, Tab5, …) live in examples/BasicM5Unified.
# ja: LovyanGFX 用ビルドプロファイル。Native(SDL) は実機なしで PC 上に画面を描く。
#     LovyanGFX が単体で扱えるボードに限定（M5GFX/M5Unified 専用の Dial・Tab5 等は
#     examples/BasicM5Unified にある）。
profiles:
  # Real hardware (ESP32, LovyanGFX autodetect).

  esp32:
    fqbn: esp32:esp32:esp32:DebugLevel=debug
    platforms:
      - platform: esp32:esp32 (3.3.9)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../
      - LovyanGFX (1.2.21)
  # Native (SDL) preview — LovyanGFX-supported boards only.

  sld2_m5stack:
    fqbn: lang-ship:native:SLD2_M5Stack
    platforms:
      - platform: lang-ship:native (1.1.2)
        platform_index_url: https://tanakamasayuki.github.io/lang-ship-arduino-core/package_lang-ship_index.json
    libraries:
      - dir: ../../
      - LovyanGFX (1.2.21)

  sld2_m5stackcore2:
    fqbn: lang-ship:native:SLD2_M5StackCore2
    platforms:
      - platform: lang-ship:native (1.1.2)
        platform_index_url: https://tanakamasayuki.github.io/lang-ship-arduino-core/package_lang-ship_index.json
    libraries:
      - dir: ../../
      - LovyanGFX (1.2.21)

  sld2_m5stackcores3:
    fqbn: lang-ship:native:SLD2_M5StackCoreS3
    platforms:
      - platform: lang-ship:native (1.1.2)
        platform_index_url: https://tanakamasayuki.github.io/lang-ship-arduino-core/package_lang-ship_index.json
    libraries:
      - dir: ../../
      - LovyanGFX (1.2.21)

  sld2_m5stickcplus:
    fqbn: lang-ship:native:SLD2_M5StickCPlus
    platforms:
      - platform: lang-ship:native (1.1.2)
        platform_index_url: https://tanakamasayuki.github.io/lang-ship-arduino-core/package_lang-ship_index.json
    libraries:
      - dir: ../../
      - LovyanGFX (1.2.21)

  sld2_m5stickcplus2:
    fqbn: lang-ship:native:SLD2_M5StickCPlus2
    platforms:
      - platform: lang-ship:native (1.1.2)
        platform_index_url: https://tanakamasayuki.github.io/lang-ship-arduino-core/package_lang-ship_index.json
    libraries:
      - dir: ../../
      - LovyanGFX (1.2.21)

  sld2_m5stackcoreink:
    fqbn: lang-ship:native:SLD2_M5StackCoreInk
    platforms:
      - platform: lang-ship:native (1.1.2)
        platform_index_url: https://tanakamasayuki.github.io/lang-ship-arduino-core/package_lang-ship_index.json
    libraries:
      - dir: ../../
      - LovyanGFX (1.2.21)

default_profile: esp32
