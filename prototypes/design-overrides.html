<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design / profile overrides probe — LGFXScreenBuilder</title>
  <!--
    使い捨てプローブ（戦略C）: Design でのプロファイル別オーバーライド編集の手触り検証専用。
    確認したいこと:
      - プロファイルタブ切替でキャンバスのサイズ/向きと実効レイアウトが変わる
      - ベース以外で動かす/隠すと「上書き」になり、ベースは「継承」と一目で分かる
      - 上書きをベースに戻せる
    ※本番には移さない。docs/ とは分離。
  -->
  <style>
    :root{
      --bg:#f5f7f8;--panel:#fff;--soft:#eef4f5;--line:#d6e0e3;--line2:#9fb2b8;
      --text:#172126;--muted:#5d6d73;--accent:#087b76;--accent-soft:#dcefed;
      --ov:#b4690e;--ov-bg:#fdf2dd;--inherit:#8aa0a7;--screen:#11191d;--sel:#4bd2c8;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit}
    button{min-height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);padding:0 10px;cursor:pointer}
    button:hover{border-color:var(--line2);background:var(--soft)}
    .topbar{display:flex;align-items:baseline;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
    .topbar h1{margin:0;font-size:16px}
    .topbar .note{color:var(--muted);font-size:12px}
    .cols{display:grid;grid-template-columns:210px minmax(420px,1fr) 300px;min-height:calc(100vh - 52px)}
    .left{border-right:1px solid var(--line);background:var(--panel)}
    .right{border-left:1px solid var(--line);background:var(--panel)}
    .center{background:#dce6e8;display:grid;grid-template-rows:auto auto 1fr auto;min-height:0}
    .section{padding:12px;border-bottom:1px solid var(--line)}
    h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
    .tab{display:grid;gap:1px;justify-items:start;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;background:var(--panel);min-width:96px}
    .tab.active{border-color:var(--accent);background:var(--accent-soft)}
    .tab .t1{font-size:13px;font-weight:650}
    .tab .t2{font-size:11px;color:var(--muted)}
    .tab .ovn{color:var(--ov)}
    .tab .basebadge{color:#c9a227}
    .stage{display:grid;place-items:center;padding:18px;overflow:auto;min-height:0}
    .device{padding:12px;border:1px solid #253137;border-radius:8px;background:#263238}
    .screen{position:relative;overflow:hidden;background:var(--screen);border:1px solid #000;touch-action:none;user-select:none}
    .part{position:absolute;border:1px solid transparent;overflow:hidden;cursor:move;white-space:nowrap;box-sizing:border-box}
    .part.text{display:flex;align-items:center;color:#fff;font-weight:650}
    .part.rect{}
    .part.selected{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel) inset}
    .part.ov{outline:1px dashed var(--ov);outline-offset:1px}
    .part.hidden{opacity:.25}
    .statusbar{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:rgba(255,255,255,.8);color:var(--muted);font-size:12px}
    .list{display:grid;gap:4px}
    .pitem{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:6px;border:1px solid transparent;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:13px}
    .pitem:hover{background:var(--soft)}
    .pitem.active{border-color:#8fcac5;background:#e1f2f0}
    .pitem .dot{width:8px;height:8px;border-radius:50%;background:var(--ov);visibility:hidden}
    .pitem.hasov .dot{visibility:visible}
    .pitem .ty{color:var(--muted);font-size:11px}
    .field{display:grid;gap:4px;margin-bottom:9px}
    .field .lab{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .field label{color:var(--muted);font-size:12px}
    .field input,.field select{width:100%;min-height:30px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--panel);color:var(--text)}
    .field textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--panel);color:var(--text);resize:vertical;min-height:42px;font:inherit}
    .field.isov input{border-color:var(--ov);background:var(--ov-bg)}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .tag{font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid}
    .tag.ov{color:var(--ov);border-color:#e3c887;background:var(--ov-bg)}
    .tag.inh{color:var(--inherit);border-color:var(--line)}
    .reset{min-height:22px;width:22px;padding:0;border-radius:5px;font-size:12px;line-height:1}
    .legend{display:flex;gap:12px;font-size:12px;color:var(--muted);padding:6px 12px}
    .legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
    .mini{min-height:26px;padding:0 8px;font-size:12px;border-radius:5px}
    .sub{color:var(--muted);font-size:12px}
    .zbar{display:flex;gap:6px;align-items:center;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
    .tips{position:fixed;right:14px;bottom:14px;z-index:20;background:rgba(23,33,38,.92);color:#cfe0e3;border:1px solid #33454d;border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.6;box-shadow:0 10px 28px rgba(0,0,0,.28);max-width:250px}
    .tips b{color:#fff;display:block;margin-bottom:3px}
    .tips kbd{background:#33454d;border-radius:3px;padding:0 4px;font-family:inherit}
    .tips .x{position:absolute;top:4px;right:6px;cursor:pointer;color:#8aa0a7}
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Design — プロファイル別オーバーライド</h1>
    <span class="note">使い捨てプローブ — タブでプロファイル切替。ベース以外で動かす/隠すと「上書き」になる</span>
  </header>

  <div class="tips" id="tips">
    <span class="x" onclick="this.parentNode.style.display='none'">×</span>
    <b>操作のヒント</b>
    タブ：プロファイル切替（base 以外で編集＝上書き）<br>
    パーツドラッグ：移動<br>
    <kbd>矢印</kbd> 移動（<kbd>Shift</kbd>=10px）<br>
    <kbd>Ctrl</kbd>+<kbd>矢印</kbd> リサイズ<br>
    ホイール：拡大縮小／中ボタン＋ドラッグ：パン
  </div>

  <div class="cols">
    <aside class="left">
      <div class="section">
        <h2>Parts（このプロファイルでの状態）</h2>
        <div class="list" id="part-list"></div>
      </div>
      <div class="legend">
        <span><span class="sw" style="background:var(--ov)"></span>上書き</span>
        <span><span class="sw" style="background:var(--inherit)"></span>継承（ベース）</span>
      </div>
    </aside>

    <main class="center">
      <div class="tabs" id="tabs"></div>
      <div class="zbar">
        <span class="sub">中ボタン=パン／ホイール=ズーム</span><span style="flex:1"></span>
        <button class="mini" id="z-out">−</button>
        <span class="sub" id="z-val">100%</span>
        <button class="mini" id="z-in">＋</button>
        <button class="mini" id="z-reset">100%に戻す</button>
      </div>
      <div class="stage" id="stage">
        <div class="device"><div class="screen" id="screen"></div></div>
      </div>
      <div class="statusbar"><span id="st-sel">未選択</span><span id="st-prof"></span></div>
    </main>

    <aside class="right">
      <div class="section">
        <h2 id="insp-title">プロパティ</h2>
        <div id="props"></div>
      </div>
    </aside>
  </div>

  <script>
    const profiles=[
      {id:'Core',     w:320,h:240,rotation:1,base:true},
      {id:'Cardputer',w:240,h:135,rotation:1,base:false},
      {id:'Stick',    w:135,h:240,rotation:0,base:false},
    ];
    let active='Core', selected='title';

    // 各 Part: base=ベース配置, ov={profileId:{部分差分}}
    const parts=[
      {id:'headerBand',type:'rect',base:{x:0,y:0,w:320,h:40,visible:true,color:'#1e2a30'},ov:{}},
      {id:'title',     type:'text',base:{x:12,y:10,w:140,h:22,visible:true,text:'Main',font:16,color:'#ffffff'},ov:{}},
      {id:'battery',   type:'text',base:{x:250,y:12,w:60,h:18,visible:true,text:'82%',font:13,color:'#9ce5ac'},ov:{}},
      {id:'temp',      type:'text',base:{x:18,y:70,w:180,h:44,visible:true,text:'24.5C',font:34,color:'#ffffff'},ov:{}},
      {id:'panel',     type:'rect',base:{x:18,y:150,w:284,h:54,visible:true,color:'#172126'},ov:{}},
    ];

    const prof=()=>profiles.find(p=>p.id===active);
    const part=id=>parts.find(p=>p.id===id);
    const eff=p=>{const pr=prof();return pr.base?p.base:Object.assign({},p.base,p.ov[pr.id]||{});};
    const isOv=(p,k)=>{const pr=prof();return !pr.base && p.ov[pr.id] && (k in p.ov[pr.id]);};
    const partHasOv=(p,pid)=>p.ov[pid]&&Object.keys(p.ov[pid]).length>0;
    const ovCount=pid=>parts.filter(p=>partHasOv(p,pid)).length;
    function setField(p,k,v){const pr=prof(); if(pr.base){p.base[k]=v;} else {(p.ov[pr.id]=p.ov[pr.id]||{})[k]=v;}}
    function clearField(p,k){const pr=prof(); if(pr.base||!p.ov[pr.id])return; delete p.ov[pr.id][k]; if(!Object.keys(p.ov[pr.id]).length)delete p.ov[pr.id];}
    function clearPart(p){const pr=prof(); if(!pr.base)delete p.ov[pr.id];}
    const orient=(w,h)=>w>h?'横':h>w?'縦':'正方';

    /* ---- tabs ---- */
    function renderTabs(){
      const el=document.getElementById('tabs'); el.innerHTML='';
      profiles.forEach(p=>{
        const n=ovCount(p.id);
        const t=document.createElement('div'); t.className='tab'+(p.id===active?' active':'');
        t.innerHTML=`<span class="t1">${p.id}</span>`+
          `<span class="t2">${p.w}×${p.h} · `+(p.base?`<span class="basebadge">base</span>`:(n?`<span class="ovn">上書き ${n}</span>`:'継承のみ'))+`</span>`;
        t.onclick=()=>{active=p.id;renderAll();};
        el.appendChild(t);
      });
    }

    /* ---- canvas ---- */
    let scale=1, zoom=1;
    function renderCanvas(){
      const pr=prof(), scr=document.getElementById('screen');
      scale=Math.min(440/pr.w, 300/pr.h, 2.2)*zoom;
      scr.style.width=(pr.w*scale)+'px'; scr.style.height=(pr.h*scale)+'px';
      scr.innerHTML='';
      parts.forEach(p=>{
        const e=eff(p);
        const d=document.createElement('div');
        d.className='part '+p.type+(p.id===selected?' selected':'')+(partHasOv(p,pr.id)?' ov':'')+(e.visible?'':' hidden');
        d.dataset.id=p.id;
        d.style.left=(e.x*scale)+'px'; d.style.top=(e.y*scale)+'px';
        d.style.width=(e.w*scale)+'px'; d.style.height=(e.h*scale)+'px';
        if(p.type==='text'){d.style.color=e.color;d.style.fontSize=(e.font*scale)+'px';d.textContent=e.text;}
        else {d.style.background=e.color;}
        scr.appendChild(d);
      });
    }

    /* ---- part list ---- */
    function renderList(){
      const el=document.getElementById('part-list'); el.innerHTML='';
      const pr=prof();
      parts.forEach(p=>{
        const e=eff(p);
        const it=document.createElement('div');
        it.className='pitem'+(p.id===selected?' active':'')+(partHasOv(p,pr.id)?' hasov':'');
        it.innerHTML=`<span class="dot"></span><span>${p.id}${e.visible?'':' （非表示）'}</span><span class="ty">${p.type}</span>`;
        it.onclick=()=>{selected=p.id;renderAll();};
        el.appendChild(it);
      });
    }

    /* ---- inspector ---- */
    function fieldRow(p,key,label,type){
      const e=eff(p), pr=prof(), ov=isOv(p,key);
      const tag = pr.base ? '' : (ov?'<span class="tag ov">上書き</span>':'<span class="tag inh">継承</span>');
      const reset = (!pr.base && ov)?`<button class="reset" data-reset="${key}" title="ベースに戻す">↺</button>`:'';
      const val = type==='checkbox' ? (e[key]?'checked':'') : `value="${e[key]}"`;
      const input = type==='checkbox'
        ? `<input type="checkbox" data-k="${key}" ${val} style="width:auto;min-height:auto">`
        : `<input type="${type}" data-k="${key}" ${val}>`;
      return `<div class="field ${ov?'isov':''}"><div class="lab"><label>${label}</label><span class="row" style="display:flex;gap:4px;align-items:center">${tag}${reset}</span></div>${input}</div>`;
    }
    function renderProps(){
      const p=part(selected), el=document.getElementById('props'), pr=prof();
      document.getElementById('insp-title').textContent = pr.base?'プロパティ（ベース編集）':`プロパティ（${pr.id} の差分編集）`;
      if(!p){el.innerHTML='<p class="sub">パーツを選択してください。</p>';return;}
      let h='';
      h+=`<div class="two">${fieldRow(p,'x','X','number')}${fieldRow(p,'y','Y','number')}</div>`;
      h+=`<div class="two">${fieldRow(p,'w','幅','number')}${fieldRow(p,'h','高さ','number')}</div>`;
      if(p.type==='text'){ h+=fieldRow(p,'text','文字','text'); h+=fieldRow(p,'font','文字サイズ','number'); }
      h+=fieldRow(p,'visible','表示','checkbox');
      h+=`<div class="field"><label>備考（全プロファイル共通のメモ）</label><textarea id="p-desc" rows="2">${p.desc||''}</textarea></div>`;
      if(!pr.base && partHasOv(p,pr.id)) h+=`<button class="mini" id="reset-part">このパーツの上書きを全部ベースに戻す</button>`;
      el.innerHTML=h;
      el.querySelectorAll('[data-k]').forEach(inp=>{
        const k=inp.dataset.k, t=inp.type;
        const ev=(t==='checkbox')?'change':'input';
        inp.addEventListener(ev,()=>{
          const v = t==='checkbox'?inp.checked : (t==='number'?(+inp.value||0):inp.value);
          setField(p,k,v); renderCanvas(); renderList(); renderTabs(); renderStatus();
          // 入力中はフォーカス維持のため props は作り直さない（badge更新は次回選択時）
          markFieldOv(inp);
        });
      });
      el.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{clearField(p,b.dataset.reset);renderAll();});
      const dsc=el.querySelector('#p-desc'); if(dsc)dsc.oninput=e=>{p.desc=e.target.value;};
      const rp=el.querySelector('#reset-part'); if(rp)rp.onclick=()=>{ if(!confirm(`${p.id} の ${pr.id} 向け上書きを全部ベースに戻しますか？`))return; clearPart(p);renderAll();};
    }
    function markFieldOv(inp){
      const f=inp.closest('.field'); if(!f)return;
      const pr=prof(); if(pr.base)return;
      const ov=isOv(part(selected),inp.dataset.k);
      f.classList.toggle('isov',ov);
      const lab=f.querySelector('.lab .row');
      if(lab && !lab.querySelector('.tag.ov') && ov){ lab.insertAdjacentHTML('afterbegin','<span class="tag ov">上書き</span>'); const inh=lab.querySelector('.tag.inh'); if(inh)inh.remove(); }
    }

    function renderStatus(){
      const p=part(selected), pr=prof();
      document.getElementById('st-sel').textContent = p?`選択: ${p.id}  (x:${eff(p).x}, y:${eff(p).y}, w:${eff(p).w}, h:${eff(p).h})`:'未選択';
      document.getElementById('st-prof').textContent = `${pr.id} ${pr.w}×${pr.h}（${orient(pr.w,pr.h)} / rotation ${pr.rotation}）`;
      const zv=document.getElementById('z-val'); if(zv)zv.textContent=Math.round(zoom*100)+'%';
    }

    function renderAll(){renderTabs();renderCanvas();renderList();renderProps();renderStatus();}

    /* ---- drag move ---- */
    let drag=null;
    const screen=document.getElementById('screen');
    screen.addEventListener('pointerdown',e=>{
      if(e.button!==0)return;   // 左ボタンのみ（中ボタンはパン）
      const id=e.target.dataset.id; if(!id){selected=null;renderAll();return;}
      selected=id; renderAll();
      const e0=eff(part(id)); drag={p:part(id),sx:e.clientX,sy:e.clientY,ox:e0.x,oy:e0.y};
      screen.setPointerCapture(e.pointerId); e.preventDefault();
    });
    screen.addEventListener('pointermove',e=>{
      if(!drag)return;
      const dx=Math.round((e.clientX-drag.sx)/scale), dy=Math.round((e.clientY-drag.sy)/scale);
      setField(drag.p,'x',drag.ox+dx); setField(drag.p,'y',drag.oy+dy);
      // drag 中もインスペクタ・一覧・タブ・座標をライブ更新（フォーカスはキャンバス側）
      renderTabs(); renderCanvas(); renderList(); renderProps(); renderStatus();
    });
    screen.addEventListener('pointerup',()=>{if(drag){drag=null;renderTabs();renderList();renderProps();}});

    // マウスホイールで拡大縮小（自動フィットに対する倍率）
    function setZoom(v){ zoom=Math.max(0.4,Math.min(6,v)); renderCanvas(); renderStatus(); }
    screen.addEventListener('wheel',e=>{ e.preventDefault(); setZoom(zoom*(e.deltaY<0?1.1:1/1.1)); },{passive:false});
    document.getElementById('z-in').onclick=()=>setZoom(zoom*1.2);
    document.getElementById('z-out').onclick=()=>setZoom(zoom/1.2);
    document.getElementById('z-reset').onclick=()=>setZoom(1);
    // 中ボタンドラッグでパン（CAD風）
    const stage=document.getElementById('stage'); let pan=null;
    stage.addEventListener('pointerdown',e=>{ if(e.button!==1)return; e.preventDefault(); pan={x:e.clientX,y:e.clientY,sl:stage.scrollLeft,st:stage.scrollTop}; stage.setPointerCapture(e.pointerId); stage.style.cursor='grabbing'; });
    stage.addEventListener('pointermove',e=>{ if(!pan)return; stage.scrollLeft=pan.sl-(e.clientX-pan.x); stage.scrollTop=pan.st-(e.clientY-pan.y); });
    stage.addEventListener('pointerup',()=>{ if(pan){pan=null;stage.style.cursor='';} });

    // キー操作: 矢印=移動(±1) / Shift+矢印=移動(±10) / Ctrl(⌘)+矢印=リサイズ。base以外なら上書きになる。
    document.addEventListener('keydown',e=>{
      if(!selected)return;
      const t=document.activeElement&&document.activeElement.tagName;
      if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return;
      const dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
      if(!dir)return; e.preventDefault();
      const step=e.shiftKey?10:1, p=part(selected), e0=eff(p);
      if(e.ctrlKey||e.metaKey){ setField(p,'w',Math.max(2,e0.w+dir[0]*step)); setField(p,'h',Math.max(2,e0.h+dir[1]*step)); }
      else { setField(p,'x',e0.x+dir[0]*step); setField(p,'y',e0.y+dir[1]*step); }
      renderTabs();renderCanvas();renderList();renderProps();renderStatus();
    });

    renderAll();
  </script>
</body>
</html>
