<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UX プローブ一覧 — LGFXScreenBuilder</title>
  <!--
    使い捨てプローブのリンク集（操作感検証用）。
    1インタラクション＝1枚のHTML。本番（tools/authoring/）が各画面をカバーしたら、
    その画面のプローブから順に削除する方針。詳細は README.ja.md。
  -->
  <style>
    :root{
      --bg:#f5f7f8;--panel:#fff;--soft:#eef4f5;--line:#d6e0e3;--line2:#9fb2b8;
      --text:#172126;--muted:#5d6d73;--accent:#087b76;--accent-soft:#dcefed;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);padding:28px 18px}
    .wrap{max-width:760px;margin:0 auto}
    h1{margin:0 0 4px;font-size:20px}
    .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
    .grid{display:grid;gap:10px}
    a.card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
      text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);
      border-radius:10px;padding:14px 16px}
    a.card:hover{border-color:var(--accent);background:var(--accent-soft)}
    .num{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;
      background:var(--soft);color:var(--accent);font-weight:700;font-size:14px}
    .t1{font-size:15px;font-weight:650}
    .t2{font-size:12.5px;color:var(--muted);margin-top:2px}
    .file{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
    .arrow{color:var(--line2);font-size:18px}
    a.card:hover .arrow{color:var(--accent)}
    .tag{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:8px;
      padding:0 6px;color:var(--muted);margin-left:6px}
    .foot{margin-top:24px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>LGFXScreenBuilder — UX プローブ</h1>
    <p class="sub">操作感の検証専用。作り捨て前提（本番 <code>tools/authoring/</code> が各画面をカバーしたら順次削除）。</p>

    <div class="grid" id="grid"></div>

    <p class="foot">
      方針・ローカル起動方法は <a href="README.ja.md">README.ja.md</a>（EN: <a href="README.md">README.md</a>）／
      追加要望のバックログは <a href="REQUESTS.ja.md">REQUESTS.ja.md</a>。
    </p>
  </div>

  <script>
    const probes=[
      {f:'profiles.html', t:'Profiles', d:'プロファイル一覧/追加・向き/サイズ表示・ボード割当・default・対象ライブラリ選択'},
      {f:'design.html',   t:'Design',   d:'左ペイン=シーン／上タブ=プロファイルの二軸。各プロファイルがシーンごとに独立レイアウトを持つ（上書き概念なし）'},
      {f:'assets.html',   t:'Assets',   d:'画像 Import（実ファイル可）→ 一覧 → 選択 → インラインでスライス'},
      {f:'asset-slice.html', t:'Asset slicing', d:'シート画像のスライス（矩形ドラッグ作成・移動/リサイズ・命名・グリッド一括生成）', tag:'post-MVP'},
      {f:'export.html',   t:'Export',   d:'生成物プレビュー（<Project>.h / _assets.h / _example.ino）・出力設定・チェック'},
    ];
    const g=document.getElementById('grid');
    probes.forEach((p,i)=>{
      const a=document.createElement('a'); a.className='card'; a.href=p.f;
      a.innerHTML=`<span class="num">${i+1}</span>`+
        `<span><span class="t1">${p.t}${p.tag?`<span class="tag">${p.tag}</span>`:''}</span>`+
        `<div class="t2">${p.d}</div><div class="file">${p.f}</div></span>`+
        `<span class="arrow">→</span>`;
      g.appendChild(a);
    });
  </script>
</body>
</html>
