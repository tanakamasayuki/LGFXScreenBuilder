# Font introspection harness (SPEC §8.7.2, phase 1b). LovyanGFX is the single
# representative catalog (its font set equals M5GFX's at the pinned versions),
# so we introspect once here. The LovyanGFX version MUST match the pin in
# tools/fontcatalog/sketch.yaml — gen.py reads that pin and resolves the matching
# copy under ~/.arduino15/internal, failing loudly if it is not downloaded.
profiles:
  host:
    fqbn: lang-ship:host:host:mode=lgfx
    port: socket://localhost
    platforms:
      - platform: lang-ship:host (1.4.7)
        platform_index_url: https://tanakamasayuki.github.io/lang-ship-arduino-core/package_lang-ship_index.json
    libraries:
      - LovyanGFX (1.2.26)
      - dir: ../../../   # repo root (this sketch lives under tests/manual/font_introspect/)

default_profile: host
