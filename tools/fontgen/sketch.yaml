# Source-of-truth for the font-catalog library versions (SPEC §8.7.2).
# tools/gen-fonts.mjs reads the pinned versions here and parses the matching
# copy under ~/.arduino15/internal/<Name>_<version>_<hash> (resolved by exact
# version, never "whatever happens to be there"). The same sketch is the host
# introspection harness (metrics / coverage / size / sample PNGs, phase 1b).
#
# After bumping a version, build once so the exact copy is downloaded:
#   arduino-cli compile --profile host tools/fontgen
profiles:
  host:
    fqbn: lang-ship:host:host:mode=lgfx
    platforms:
      - platform: lang-ship:host (1.4.4)
        platform_index_url: https://tanakamasayuki.github.io/lang-ship-arduino-core/package_lang-ship_index.json
    libraries:
      - LovyanGFX (1.2.21)
      - M5GFX (0.2.22)
      - dir: ../../

default_profile: host
